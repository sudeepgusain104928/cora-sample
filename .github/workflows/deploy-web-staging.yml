name: Staging - Web App Deploy

on:
  push:
    branches:
      - 'release/web-v*' # Triggers ONLY on web release branches
    paths:
      - 'apps/web/**'
      - 'packages/ui/**' # Triggers if shared components change
      - 'package.json'

jobs:
  stage-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Nx is smart: it will read the root, but only build the web target
      - name: Build Web App
        run: |
          npm ci
          npx nx build @cora/web

      - name: Trigger Render Web Staging Webhook
        run: |
          curl -X POST "${{ secrets.RENDER_STAGING_FRONTEND_HOOK }}"